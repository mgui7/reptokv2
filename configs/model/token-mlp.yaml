name: MLP-Mixer
target: ldm.generation.TokenFlow
params:
  schedule: linear
  sigma_min: 0.0
  net_cfg:
    target: ldm.models.mlp_mixer.MLPMixer1D
    params:
      n_channels: 1
      channels: 1152
      dim: 1280
      depth: 28
      # Original ordinary mlp-mixer.yaml conventions: token axis, then features.
      expansion_factor: 4
      expansion_factor_token: 2
      dropout: 0.0
      num_classes: 1000
      class_dropout_prob: 0.1
      n_extra_tokens: 0
      zero_init_last: false
      compile: false
