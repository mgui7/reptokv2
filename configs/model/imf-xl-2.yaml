name: iMF-MMDiT-XL-2
target: ldm.imf.ImprovedMeanFlow
params:
  fm_ratio: 0.5
  time_mean: 0.4  # Reversed paper convention: here 0=noise, 1=data.
  time_std: 1.0
  net_cfg:
    target: ldm.models.transformer.imf_mmdit.IMFMMDiT
    params:
      in_channels: 4
      input_size: 32
      depth: 28
      hidden_size: 1152
      patch_size: 2
      num_heads: 16
      num_classes: 1000
      compile: false  # JVP uses eager FP32; tokenizer keeps its own setting.
      learn_sigma: true
      load_from_ckpt: checkpoints/SiT-XL-2-256x256.pt
      null_class_cond: true
