name: ImageNet_256
num_classes: 1000
target: ldm.dataloader.WebDataModuleFromConfig
params:
  tar_base:
    - /export/group/datasets/ILSVRC/wds_shards    # MVL
    - /p/scratch/degeai/datasets     # Juelich
  batch_size: 128
  val_batch_size: 16
  num_workers: 4
  val_num_workers: 1
  multinode: True
  remove_keys:
    - pickle
    - json
    - latent.npy
  train:
    shards: 'imagenet_wds/ImageNetTrain-train-{000000..000284}.tar'
    shuffle: 100
    image_key: jpeg
    rename:
      image: jpeg
      label: cls
    image_transforms:
      - target: torchvision.transforms.RandomHorizontalFlip
        params:
          p: 0.5
      - target: torchvision.transforms.Resize
        params:
          size: 256
          interpolation: 2
          antialias: True
      - target: torchvision.transforms.RandomCrop
        params:
          size: 256

  validation:
    shards: 'imagenet256_latents_wds/val-shards/{000000..000033}.tar'
    image_key: jpeg
    rename:
      image: jpeg
      label: cls
    image_transforms:
      - target: torchvision.transforms.Resize
        params:
          size: 256
          interpolation: 2
          antialias: True
      - target: torchvision.transforms.CenterCrop
        params:
          size: 256
