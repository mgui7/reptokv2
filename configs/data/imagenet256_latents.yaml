name: ImageNet_256
num_classes: 1000
target: ldm.dataloader.WebDataModuleFromConfig
params:
  tar_base:
    - /p/scratch/degeai/datasets/imagenet256_latents_wds     # Juelich
    - /export/group/datasets/ILSVRC/imagenet256_latents_wds  # MVL
  batch_size: 32
  val_batch_size: 16
  num_workers: 4
  val_num_workers: 1
  multinode: True
  remove_keys:
    - pickle
    - json
  train:
    shards: 'ImageNetTrain-train-{000000..000284}.tar'
    shuffle: 100
    image_key: jpeg
    rename:
      image: jpeg
      label: cls
      latent: latent.npy
    image_transforms:
      # no random flipping, as latents might not match
      # - target: torchvision.transforms.RandomHorizontalFlip
      #   params:
      #     p: 0.5
      - target: torchvision.transforms.Resize
        params:
          size: 256
          interpolation: 2
          antialias: True
      - target: torchvision.transforms.CenterCrop
        params:
          size: 256

  validation:
    # shards: 'ImageNetValidation-validation-{000000..000012}.tar'
    shards: 'val-shards/{000000..000033}.tar'
    image_key: jpeg
    rename:
      image: jpeg
      label: cls
      latent: latent.npy
    image_transforms:
      - target: torchvision.transforms.Resize
        params:
          size: 256
          interpolation: 2
          antialias: True
      - target: torchvision.transforms.CenterCrop
        params:
          size: 256
