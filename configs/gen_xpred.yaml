defaults:
  - gen
  - override data: imagenet256_latents
  - _self_

name: gen/xpred-jit
model:
  params:
    prediction_type: x
    t_eps: 0.05
trainer_params:
  max_steps: 100000
  max_time_seconds: 41400
  validate_before_training: true
  limit_val_batches: 16
  val_check_interval: 1000
checkpoint_params:
  every_n_train_steps: 10000
  save_best_metric: gfid
