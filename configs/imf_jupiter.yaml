defaults:
  - imf
  - _self_

# Match the completed stage-1 cos01 baseline (job 1965038), not its 100k gen stage.
name: recon
trainer_params:
  max_steps: 300000
  max_time_seconds: 41400
  limit_val_batches: 16

data:
  params:
    tar_base: /e/project1/jureap52/schb/data/imagenet256_latents_wds

model:
  params:
    net_cfg:
      params:
        load_from_ckpt: /e/scratch/jureap52/fischer13/checkpoints/SiT-XL-2-256x256.pt
autoencoder:
  params:
    encoder_path: /e/scratch/jureap52/fischer13/checkpoints/taesd_encoder.pth
    decoder_path: /e/scratch/jureap52/fischer13/checkpoints/taesd_decoder.pth
